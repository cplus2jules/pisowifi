# /etc/dnsmasq.d/pisowifi.conf — DHCP + DNS for customers on eth1.
interface=eth1
bind-interfaces

# Same range LPB used, so existing devices keep their addresses.
dhcp-range=10.0.0.5,10.0.30.254,255.255.224.0,12h
dhcp-option=option:router,10.0.0.1
dhcp-option=option:dns-server,10.0.0.1
dhcp-authoritative

# Upstream resolvers (customers can't pick their own: the firewall forces
# every DNS query to this box).
no-resolv
server=1.1.1.1
server=8.8.8.8
cache-size=2000
domain-needed
bogus-priv
stop-dns-rebind
address=/pisowifi.local/10.0.0.1
