[package]
name = "pisowifi"
version = "0.1.0"
edition = "2021"
description = "Open-source, security-first Piso WiFi coin vending system"
license = "MIT"

[dependencies]
anyhow = "1"
bytes = "1"
argon2 = "0.5"
axum = { version = "0.8", default-features = false, features = ["json", "query", "tokio", "http1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
libc = "0.2"
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
rand = "0.8"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gpiocdev = "0.7"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
